<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Retro Bowl Modded</title>
<link rel="icon" type="image/jpeg" href="img/icon.jpg">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#000;border:0;overflow:hidden}
canvas{image-rendering:optimizeSpeed;image-rendering:pixelated;touch-action:none;-ms-touch-action:none;margin:0;padding:0;border:0}
div.gm4html5_div_class{margin:0;padding:0;border:0}
#GM4HTML5_loadingscreen{display:none!important}
#jax-open{
  position:fixed;top:12px;right:12px;z-index:10000;
  font-family:"Press Start 2P",monospace;font-size:11px;color:#fff;
  background:#1a4fd6;border:3px solid #fff;border-radius:6px;
  padding:12px 14px;cursor:pointer;opacity:1;visibility:visible;
  transition:opacity .2s ease,visibility 0s linear 0s
}
#jax-open.hidden{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s linear .2s}
#jax-dimmer{
  position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .25s ease,visibility 0s linear .25s
}
#jax-dimmer.visible{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease,visibility 0s linear 0s}
#jax-panel{
  position:fixed;top:12px;right:12px;bottom:12px;z-index:10001;width:360px;
  font-family:"Press Start 2P",monospace;font-size:11px;color:#fff;
  background:#1a4fd6;border:3px solid #fff;border-radius:10px;
  box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;
  opacity:0;visibility:hidden;transform:translateX(calc(100% + 24px));
  pointer-events:none;transition:opacity .2s ease,transform .25s ease,visibility 0s linear .25s
}
#jax-panel.open{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto;transition:opacity .2s ease,transform .25s ease,visibility 0s linear 0s}
#jax-panel.mod-ui-hidden,#jax-open.mod-ui-hidden,#jax-dimmer.mod-ui-hidden{
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,visibility 0s linear .2s
}
#jax-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 16px 13px;border-bottom:2px solid rgba(255,255,255,.35);flex-shrink:0
}
#jax-head span{font-size:12px;letter-spacing:.5px}
#jax-title{display:flex;align-items:center;gap:9px}
#jax-x{
  background:transparent;border:2px solid #fff;color:#fff;border-radius:4px;
  width:30px;height:30px;font-family:"Press Start 2P",monospace;font-size:11px;
  cursor:pointer;line-height:18px;padding:0
}
#jax-body{flex:1;overflow-y:auto;padding:14px 16px 18px;scrollbar-width:none;-webkit-user-select:text;user-select:text}
#jax-body::-webkit-scrollbar{display:none}
#jax-foot{padding:12px 16px 14px;border-top:2px solid rgba(255,255,255,.35);flex-shrink:0;text-align:center}
#jax-foot a{font-family:"Press Start 2P",monospace;font-size:10px;color:#fff;text-decoration:underline}
.sec{margin:0 0 18px;padding:12px 10px 4px;border:2px solid rgba(255,255,255,.35);border-radius:6px}
.sec label{display:block;margin:0 0 8px;font-size:11px;color:#fff;letter-spacing:.3px}
.mod-category{margin:0 0 18px;padding:12px 10px 4px;border:2px solid rgba(255,255,255,.35);border-radius:6px}
.mod-category>h2{margin:0 0 10px;font-size:10px;color:#fff;letter-spacing:.4px}
.mod-toggle{display:flex;align-items:center;gap:9px;margin:0 0 10px;font-size:9px;line-height:1.45;cursor:pointer}
.mod-toggle input{width:16px;height:16px;flex-shrink:0;accent-color:#fff}
.line{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.line input{
  flex:1;min-width:0;font-family:"Press Start 2P",monospace;font-size:11px;color:#fff;
  background:#163db0;border:2px solid #fff;border-radius:6px;padding:11px 9px;outline:none;
  user-select:text;-webkit-user-select:text
}
.sq{
  width:36px;height:36px;flex-shrink:0;font-family:"Press Start 2P",monospace;font-size:13px;color:#fff;
  background:#163db0;border:2px solid #fff;border-radius:6px;cursor:pointer;padding:0;line-height:22px
}
.sq:active{background:#0f2f8f}
.quick{display:flex;gap:6px;margin-top:6px}
.quick button,.fullbtn{
  flex:1;font-family:"Press Start 2P",monospace;font-size:10px;color:#fff;
  background:#163db0;border:2px solid #fff;border-radius:6px;padding:11px 4px;cursor:pointer
}
.fullbtn{width:100%;margin-top:4px}
.quick button:active,.fullbtn:active{background:#0f2f8f}
.two{display:flex;gap:6px;margin-top:6px}
.two button{
  flex:1;font-family:"Press Start 2P",monospace;font-size:10px;color:#fff;
  background:#163db0;border:2px solid #fff;border-radius:6px;padding:11px 4px;cursor:pointer
}
#jax-panel button,#jax-panel label{user-select:text;-webkit-user-select:text}
@media (max-width:520px){
  #jax-open{top:8px;right:8px;font-size:9px;padding:10px 11px}
  #jax-panel{top:8px;right:8px;bottom:8px;width:calc(100vw - 16px)}
}
#jax-alert,#jax-export{
  display:none;position:fixed;inset:0;z-index:10050;background:rgba(0,0,0,.55);
  align-items:center;justify-content:center
}
#jax-alert.show,#jax-export.show{display:flex}
#jax-alert .box,#jax-export .box{
  width:min(360px,92vw);background:#1a4fd6;border:3px solid #fff;border-radius:12px;
  padding:16px;font-family:"Press Start 2P",monospace;color:#fff;text-align:center;
  box-shadow:#101010 12px 12px 0
}
#jax-alert .box p,#jax-export .box p{font-size:8px;line-height:1.7;margin:0 0 14px}
#jax-export .box input{
  width:100%;box-sizing:border-box;font-family:"Press Start 2P",monospace;font-size:9px;color:#fff;
  background:#163db0;border:2px solid #fff;border-radius:8px;padding:12px 10px;outline:none;margin:0 0 14px
}
#jax-alert .actions,#jax-export .actions{display:flex;gap:8px}
#jax-alert .actions button,#jax-export .actions button{
  flex:1;font-family:"Press Start 2P",monospace;font-size:7px;color:#fff;
  background:#163db0;border:2px solid #fff;border-radius:8px;padding:10px 6px;cursor:pointer
}
</style>
</head>
<body>
<div class="gm4html5_div_class" id="gm4html5_div_id">
  <img src="html5game/splash.png" id="GM4HTML5_loadingscreen" style="display:none" alt="">
  <canvas id="canvas" width="853" height="480" tabindex="0">
    <p>Your browser does not support HTML5 canvas.</p>
  </canvas>
</div>

<div id="jax-dimmer"></div>
<button id="jax-open" type="button" tabindex="-1">MOD MENU</button>

<div id="jax-panel">
  <div id="jax-head">
    <span id="jax-title">JAXSONS MOD MENU</span>
    <button id="jax-x" type="button" tabindex="-1">X</button>
  </div>
  <div id="jax-body">
    <div class="mod-category">
      <h2>GAMEPLAY CHEATS</h2>
      <label class="mod-toggle"><input type="checkbox" data-mod="fieldGoalAimbot" tabindex="-1">FIELD GOAL AIMBOT</label>
      <label class="mod-toggle"><input type="checkbox" data-mod="noTackles" tabindex="-1">NO TACKLES</label>
      <label class="mod-toggle"><input type="checkbox" data-mod="noInterceptions" tabindex="-1">NO INTERCEPTIONS</label>
    </div>
    <div class="mod-category">
      <h2>PLAYER CHEATS</h2>
      <label class="mod-toggle"><input type="checkbox" data-mod="noFumbles" tabindex="-1">NO FUMBLES</label>
      <label class="mod-toggle"><input type="checkbox" data-mod="noInjuries" tabindex="-1">NO INJURIES</label>
      <label class="mod-toggle"><input type="checkbox" data-mod="infiniteQBThrowRange" tabindex="-1">INFINITE QB THROW RANGE</label>
      <label class="mod-toggle"><input type="checkbox" data-mod="infiniteStamina" tabindex="-1">INFINITE STAMINA</label>
      <label class="mod-toggle"><input type="checkbox" data-mod="autoStiffArm" tabindex="-1">AUTO STIFF ARM</label>
      <label style="display:block;margin:12px 0 4px;font-size:9px">PLAYER SPEED</label>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <input id="v-speed" type="range" min="1" max="10" step="0.1" value="1" style="flex:1;accent-color:#fff" tabindex="-1">
        <span id="v-speed-label" style="font-size:9px;min-width:32px">1.0x</span>
      </div>
    </div>
    <div class="mod-category">
      <h2>GAME UTILITIES</h2>
      <label class="mod-toggle"><input type="checkbox" data-mod="freezeClock" tabindex="-1">FREEZE CLOCK</label>
      <label class="mod-toggle"><input type="checkbox" data-mod="unlimitedDowns" tabindex="-1">UNLIMITED DOWNS</label>
      <button class="fullbtn" type="button" id="a-give-td" tabindex="-1">GIVE TD</button>
      <button class="fullbtn" type="button" id="a-win-game" tabindex="-1">WIN GAME</button>
    </div>
    <div class="sec">
      <label>COACHING CREDITS</label>
      <div class="line">
        <input id="v-credits" type="text" value="999999" inputmode="numeric">
        <button class="sq" type="button" id="c-plus" tabindex="-1">+</button>
        <button class="sq" type="button" id="c-minus" tabindex="-1">-</button>
      </div>
      <div class="quick">
        <button type="button" id="c-100" tabindex="-1">+100</button>
        <button type="button" id="c-500" tabindex="-1">+500</button>
        <button type="button" id="c-1000" tabindex="-1">+1000</button>
      </div>
      <button class="fullbtn" type="button" id="a-credits" tabindex="-1">APPLY</button>
    </div>
    <div class="sec">
      <label>SALARY CAP</label>
      <div class="line">
        <input id="v-salary" type="text" value="999999999" inputmode="numeric">
        <button class="sq" type="button" id="s-plus" tabindex="-1">+</button>
        <button class="sq" type="button" id="s-minus" tabindex="-1">-</button>
      </div>
      <button class="fullbtn" type="button" id="a-salary" tabindex="-1">APPLY</button>
    </div>
    <div class="sec">
      <label>FANS</label>
      <div class="line">
        <input id="v-fans" type="text" value="100" inputmode="numeric">
        <button class="sq" type="button" id="f-plus" tabindex="-1">+</button>
        <button class="sq" type="button" id="f-minus" tabindex="-1">-</button>
      </div>
      <button class="fullbtn" type="button" id="a-fans" tabindex="-1">APPLY</button>
    </div>
    <div class="sec">
      <label>TEAM MORALE</label>
      <button class="fullbtn" type="button" id="a-morale-max" tabindex="-1">MAX TEAM MORALE</button>
    </div>
    <div class="sec">
      <label>ROSTER LIMIT</label>
      <div class="line">
        <input id="v-roster" type="text" value="17" inputmode="numeric">
        <button class="sq" type="button" id="r-plus" tabindex="-1">+</button>
        <button class="sq" type="button" id="r-minus" tabindex="-1">-</button>
      </div>
      <button class="fullbtn" type="button" id="a-roster" tabindex="-1">APPLY</button>
    </div>
    <div class="sec">
      <label>DRAFT PICKS (ALL ROUNDS)</label>
      <div class="line">
        <input id="v-draft" type="text" value="5" inputmode="numeric">
        <button class="sq" type="button" id="d-plus" tabindex="-1">+</button>
        <button class="sq" type="button" id="d-minus" tabindex="-1">-</button>
      </div>
      <button class="fullbtn" type="button" id="a-draft" tabindex="-1">APPLY</button>
    </div>
    <div class="sec">
      <label>FACILITIES (0-10)</label>
      <div class="line">
        <input id="v-fac" type="text" value="10" inputmode="numeric">
        <button class="sq" type="button" id="fac-plus" tabindex="-1">+</button>
        <button class="sq" type="button" id="fac-minus" tabindex="-1">-</button>
      </div>
      <div class="two">
        <button type="button" id="a-fac-max" tabindex="-1">MAX</button>
        <button type="button" id="a-fac-reset" tabindex="-1">RESET</button>
      </div>
      <button class="fullbtn" type="button" id="a-fac" tabindex="-1">APPLY</button>
    </div>
    <div class="two">
      <button type="button" id="a-export" tabindex="-1">EXPORT DATA</button>
      <button type="button" id="a-import" tabindex="-1">IMPORT DATA</button>
    </div>
    <input id="f-import" type="file" accept=".json,.save,application/json" style="display:none" tabindex="-1">
    <button class="fullbtn" type="button" id="a-reload" tabindex="-1" style="margin-top:8px">RELOAD GAME</button>
  </div>
  <div id="jax-foot">
    <a href="https://github.com/jaxsonbunch/retro-bowl-modded" target="_blank" rel="noopener noreferrer" tabindex="-1">VIEW SOURCE CODE</a>
  </div>
</div>

<div id="jax-alert">
  <div class="box">
    <p>Load a modded starter save with max credits, salary cap, facilities, fans, and a full roster?</p>
    <div class="actions">
      <button type="button" id="alert-no" tabindex="-1">NO</button>
      <button type="button" id="alert-yes" tabindex="-1">YES</button>
    </div>
  </div>
</div>

<div id="jax-export">
  <div class="box">
    <p>NAME YOUR FILE</p>
    <input id="export-name" type="text" value="retrobowl-save" maxlength="64" autocomplete="off" spellcheck="false">
    <div class="actions">
      <button type="button" id="export-cancel" tabindex="-1">CANCEL</button>
      <button type="button" id="export-ok" tabindex="-1">EXPORT</button>
    </div>
  </div>
</div>

<script src="html5game/RetroBowl.js"></script>
<script src="mod-menu.js"></script>
</body>
</html>
